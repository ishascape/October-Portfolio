<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Design system · Ashni Dave</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F4F5F6" />
    <script>
      /* Set the theme before first paint: the visitor's saved choice from the toggle wins; otherwise follow the
         system setting (dark when the device is in dark mode, light otherwise). */
      try {
        var t = localStorage.getItem('theme')
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0e13')
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/design-system/main.tsx"></script>
  </body>
</html>
