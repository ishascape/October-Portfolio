<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--head--><title>Ashni Dave · Senior Product Designer</title><!--/head-->
    <meta name="theme-color" content="#F4F5F6" />
    <script>
      /* Set the theme before first paint: dark only if the visitor chose it with the toggle. Light is the default. */
      try {
        var t = localStorage.getItem('theme')
        var p = localStorage.getItem('paint')
        if (p === 'on') {
          /* Painting mode (the paintbrush) sits on top of dark. Also only when chosen. */
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.paint = 'on'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0e13')
        } else if (t === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121416')
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; the page shows in the fallback font, then swaps. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Poppins:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
