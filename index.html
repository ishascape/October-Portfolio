<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--head--><title>Ashni Dave · Senior Product Designer</title><!--/head-->
    <meta name="theme-color" content="#F4F5F6" />
    <script>
      /* Set the theme before first paint: the visitor's saved choice from the toggle wins; otherwise follow the
         system setting (dark when the device is in dark mode, light otherwise). */
      try {
        var t = localStorage.getItem('theme')
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0e13')
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <!-- Ranade comes from Fontshare (Indian Type Foundry; free for commercial web use), loaded the same non-blocking way. -->
    <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=ranade@1&display=swap" />
    <link href="https://api.fontshare.com/v2/css?f[]=ranade@1&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://api.fontshare.com/v2/css?f[]=ranade@1&display=swap" rel="stylesheet" /></noscript>
    <!-- Fonts load without blocking the first paint; the page shows in the fallback font, then swaps. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Instrument+Sans:wght@400..700&family=Poppins:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Instrument+Sans:wght@400..700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Instrument+Sans:wght@400..700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
